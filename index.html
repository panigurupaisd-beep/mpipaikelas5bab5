<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jejak Sang Teladan – Fathu Makkah &amp; Haji Wada</title>
<style>
:root{--bg:#f2f8ff;--card:#ffffff;--ink:#12263f;--mut:#566a82;--pri:#1b7fd1;--pri2:#0f2d5c;--acc:#f2b632;--ok:#17825a;--bad:#c93a3a;--soft:#e0f0fd;--bd:#c6dff3;--okbg:#dcf5e9;--badbg:#fde3e3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-size:17px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1829;--card:#13263d;--ink:#eaf2fb;--mut:#a3b6cc;--pri:#5db2f7;--pri2:#bcd9f7;--acc:#f2c25a;--ok:#55cc92;--bad:#ff8080;--soft:#1a3553;--bd:#2a4a6e;--okbg:#14382b;--badbg:#42201f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1829;--card:#13263d;--ink:#eaf2fb;--mut:#a3b6cc;--pri:#5db2f7;--pri2:#bcd9f7;--acc:#f2c25a;--ok:#55cc92;--bad:#ff8080;--soft:#1a3553;--bd:#2a4a6e;--okbg:#14382b;--badbg:#42201f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif;line-height:1.55}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pri2);color:#fff;padding:.5rem .8rem}
:root[data-theme="dark"] header,:root:not([data-theme="light"]) header{}
.hrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.brand{font-weight:800;flex:1;min-width:140px}
.chip{background:rgba(255,255,255,.18);border-radius:99px;padding:.15rem .7rem;font-size:.85rem;white-space:nowrap}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:.3rem .6rem;font:inherit;font-size:.85rem;cursor:pointer}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:.4rem;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
main{max-width:860px;margin:0 auto;padding:1rem .9rem 5.5rem}
h1,h2,h3{line-height:1.2;margin:.2rem 0 .6rem}
h2{color:var(--pri)}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:1rem;margin:.8rem 0;box-shadow:0 3px 0 var(--bd)}
.tag{display:inline-block;background:var(--soft);color:var(--pri);border-radius:99px;padding:.1rem .7rem;font-size:.8rem;font-weight:700}
.mut{color:var(--mut);font-size:.92rem}
button.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:.7rem 1.2rem;font:inherit;font-weight:700;cursor:pointer;min-height:46px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
button.btn.alt{background:var(--card);color:var(--pri);border:2px solid var(--pri);box-shadow:none}
button.btn.gold{background:var(--acc);color:#2a1d00}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn:active{transform:translateY(2px)}
.hero{text-align:center;padding:1rem .5rem}
.mascot{font-size:4.5rem;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.sky{background:linear-gradient(180deg,#1b7fd1,#7cc4f5);color:#fff;border-radius:22px;padding:1.2rem}
.sky h1{font-size:1.9rem}
.opts{display:grid;gap:.5rem}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--bd);border-radius:14px;padding:.7rem .9rem;font:inherit;cursor:pointer;min-height:46px}
.opt:hover{border-color:var(--pri)}
.opt.sel{border-color:var(--pri);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.done{opacity:.55;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem}
.tile{background:var(--soft);color:var(--ink);border:2px solid var(--bd);border-radius:16px;padding:.8rem;font:inherit;text-align:left;cursor:pointer;min-height:90px}
.tile .ic{font-size:1.8rem;display:block}
.tile .d{display:block;margin-top:.3rem;font-size:.92rem;color:var(--ink)}
.tile.open{background:var(--okbg);border-color:var(--ok)}
.fb{border-radius:14px;padding:.7rem .9rem;margin:.6rem 0;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.info{background:var(--soft);color:var(--ink)}
.fb small{display:block;font-weight:400;color:var(--ink);margin-top:.2rem}
.hb{background:none;border:0;color:var(--pri);font:inherit;text-decoration:underline;cursor:pointer;padding:.2rem 0}
.hint{background:var(--soft);border-left:5px solid var(--acc);border-radius:10px;padding:.5rem .8rem;margin:.3rem 0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.dots{display:flex;gap:6px;justify-content:center;margin:.6rem 0}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--bd)}
.dots i.on{background:var(--pri)}.dots i.cur{background:var(--acc);transform:scale(1.3)}
.slot{display:flex;gap:.5rem;align-items:center;background:var(--soft);border:2px dashed var(--bd);border-radius:12px;padding:.5rem .7rem;margin:.3rem 0;min-height:44px}
.slot b{background:var(--pri);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.6rem 0}
.bucket{border:3px dashed var(--bd);border-radius:16px;padding:1rem .5rem;text-align:center;font-weight:700;background:var(--soft);color:var(--ink);font-family:inherit;font-size:1rem;cursor:pointer;min-height:90px}
.bucket.over{border-color:var(--pri);background:var(--card)}
.dragc{background:var(--acc);color:#2a1d00;border-radius:18px;padding:1.1rem;font-weight:700;text-align:center;cursor:grab;font-size:1.05rem;user-select:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
select,input[type=text],textarea{font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--bd);border-radius:10px;padding:.4rem .6rem;max-width:100%}
textarea{width:100%;min-height:80px}
select.ok,input.ok{border-color:var(--ok);background:var(--okbg)}select.bad,input.bad{border-color:var(--bad);background:var(--badbg)}
.cloze p{margin:.7rem 0;line-height:2.2}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:1px solid var(--bd);padding:.35rem .5rem;text-align:left;vertical-align:top}
th{background:var(--soft)}
.wrap{overflow-x:auto}
.quote{border-left:5px solid var(--acc);background:var(--soft);padding:.6rem .9rem;border-radius:10px;font-style:italic}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.5rem}
.bd{text-align:center;border:2px solid var(--bd);border-radius:14px;padding:.6rem;background:var(--card);opacity:.35;filter:grayscale(1)}
.bd.on{opacity:1;filter:none;border-color:var(--acc);background:var(--soft)}
.bd .e{font-size:2rem;display:block}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--bd);padding:.5rem .8rem calc(.5rem + env(safe-area-inset-bottom,0px));display:flex;gap:.6rem;justify-content:space-between;align-items:center;z-index:20}
#navt{flex:1;text-align:center;font-size:.85rem;color:var(--mut)}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);background:var(--acc);color:#2a1d00;font-weight:800;padding:.5rem 1.1rem;border-radius:99px;opacity:0;transition:.35s;z-index:50;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tm{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:calc(1rem + env(safe-area-inset-top,0px)) .6rem 1rem;overflow:auto}
#tm[hidden]{display:none}
.modal{background:var(--card);color:var(--ink);border-radius:18px;max-width:920px;width:100%;padding:1rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.tabs button{border:2px solid var(--pri);background:var(--card);color:var(--pri);border-radius:99px;padding:.3rem .9rem;font:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff}
.tp{display:none}.tp.on{display:block}
.tp h3{color:var(--pri);margin-top:1rem}
.tp ul{padding-left:1.2rem;margin:.3rem 0}
@media (max-width:520px){.two,.buckets{grid-template-columns:1fr}.sky h1{font-size:1.5rem}}
@media print{header,nav,#toast{display:none}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <span class="brand">🕌 Jejak Sang Teladan</span>
    <span class="chip" id="hpts">⭐ 0</span>
    <span class="chip" id="hlv">🔍 Pengamat Cilik</span>
    <button id="fs-" aria-label="Perkecil huruf">A−</button><button id="fs+" aria-label="Perbesar huruf">A+</button>
    <button id="tbtn">👩‍🏫 Guru</button>
  </div>
  <div class="bar"><i id="pbar"></i></div>
</header>
<main id="stage"></main>
<nav id="nav">
  <button class="btn alt" id="prev">◀ Kembali</button>
  <span id="navt"></span>
  <button class="btn" id="next">Lanjut ▶</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tm" hidden><div class="modal" role="dialog" aria-label="Panduan Guru"><div class="row" style="justify-content:space-between"><h2 style="margin:0">👩‍🏫 Panduan &amp; Perangkat Guru</h2><button class="btn alt" id="tclose">Tutup ✕</button></div><div id="tbody"></div></div></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const norm=s=>String(s).toLowerCase().replace(/[’'`\-\s\.]/g,'');
const S={name:'',mode:'reg',pts:0,badges:[],i:0,done:{},board:[],qz:null,journal:'',saved:false};
const LEVELS=[[0,'Pengamat Cilik','🔍'],[40,'Penjelajah Sejarah','🧭'],[100,'Pejuang Cilik','🛡️'],[170,'Duta Damai','🕊️'],[240,'Teladan Sejati','🌟']];
const BADGES={mulai:['🚀','Siap Berangkat','Mulai petualangan'],sejarah:['🧭','Penjelajah Sejarah','Menyelesaikan Misi 1'],urut:['🧩','Ahli Urutan','Urutan peristiwa benar'],akhlak:['💎','Pemilah Akhlak','Memilah perilaku mulia'],arafah:['⛰️','Penjaga Pesan','Membuka 7 pesan Arafah'],hikmah:['🔗','Pemburu Hikmah','Mencocokkan 6 nilai'],aksi:['🕊️','Duta Damai','Memilih sikap terpuji'],cerdas:['🏅','Cerdas Sejarah','Kuis ≥ 75'],kritis:['🧠','Pemikir Kritis','Semua soal HOTS benar'],refleks:['💭','Hati Reflektif','Mengisi jurnal belajar']};
function lvl(){let l=LEVELS[0];LEVELS.forEach(x=>{if(S.pts>=x[0])l=x});return l}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
function upd(){$('#hpts').textContent='⭐ '+S.pts;const l=lvl();$('#hlv').textContent=l[2]+' '+l[1];$('#pbar').style.width=(S.i/(SCR.length-1)*100)+'%'}
function award(k,p,msg){if(S.done[k])return false;S.done[k]=1;S.pts+=p;toast('+'+p+' poin! '+(msg||''));upd();return true}
function badge(id){if(S.badges.includes(id))return;S.badges.push(id);setTimeout(()=>toast('🏅 Lencana baru: '+BADGES[id][1]),1900)}
const hint=t=>S.mode==='bim'?`<button class="hb" type="button">💡 Butuh petunjuk?</button><div class="hint" hidden>${t}</div>`:'';
document.addEventListener('click',e=>{if(e.target.classList.contains('hb')){const n=e.target.nextElementSibling;n.hidden=!n.hidden}});

function grid(root,items,key,pts,badgeId){
  root.innerHTML=items.map((x,i)=>`<button class="tile" type="button" data-i="${i}"><span class="ic">${x.ic}</span><b>${x.t}</b><span class="d" hidden>${x.d}</span></button>`).join('');
  const seen=new Set();
  root.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{b.querySelector('.d').hidden=false;b.classList.add('open');seen.add(b.dataset.i);
    if(seen.size===items.length){if(award(key,pts,'Semua terbuka!')&&badgeId)badge(badgeId)}});
}

/* ===== DATA ===== */
const STEPS=[
{ic:'📜',t:'Perjanjian Hudaibiyah (tahun ke-6 H)',d:'Rasulullah dan sahabat dari Madinah hendak berhaji, tetapi dihadang Kaum Quraisy di Hudaibiyah. Usman bin Affan diutus menjelaskan tujuan mereka, namun tetap tidak diizinkan masuk. Lahirlah Perjanjian Hudaibiyah, yaitu perjanjian damai.',m:'Sabar dan mengutamakan damai'},
{ic:'💔',t:'Janji Dilanggar',d:'Tidak lama kemudian, Kaum Quraisy membantu Bani Bakr menyerang Suku Khuza’ah sampai ada korban jiwa. Ini melanggar perjanjian. Suku Khuza’ah mengadu kepada Rasulullah.',m:'Janji harus ditepati'},
{ic:'🤝',t:'Jalan Damai Dulu',d:'Rasulullah mengirim utusan dan memberi tiga pilihan: (1) hentikan peperangan dengan Khuza’ah, (2) ganti kerugian korban, (3) batalkan Perjanjian Hudaibiyah. Kaum Quraisy memilih membatalkan perjanjian.',m:'Menyelesaikan masalah secara damai'},
{ic:'🐪',t:'Pasukan Bersiap',d:'Sekitar 10.000 sahabat berkumpul dan siap berangkat ke Makkah. Hatib bin Abi Baltha’ah membocorkan kabar ini kepada keluarganya, tetapi Rasulullah memaafkannya.',m:'Lembut dan pemaaf'},
{ic:'🧭',t:'Dari Empat Penjuru',d:'Pasukan dibagi empat: utara, selatan, barat, dan timur. Mereka masuk dengan kompak sambil bertakbir dan bertahmid. Rasulullah tidak berniat memerangi; beliau hanya memberi peringatan dan menunjukkan Islam di Madinah berkembang pesat.',m:'Tegas tanpa kekerasan'},
{ic:'🕊️',t:'Masuk dengan Damai',d:'Rombongan masuk dengan tenang, tidak merusak apa pun, termasuk rumah penduduk. Abu Sufyan, tokoh Quraisy, masuk Islam. Rasulullah mengumumkan, “Barang siapa masuk rumah Abu Sufyan, maka akan aman.”',m:'Menghormati penduduk'},
{ic:'🕋',t:'Di Kakbah',d:'Rasulullah dan sahabat bertawaf. Patung-patung di sekeliling Kakbah dibersihkan. Bilal bin Rabah naik ke puncak Kakbah dan mengumandangkan azan, azan pertama di Makkah.',m:'Menghormati tempat ibadah'},
{ic:'🌟',t:'Berbondong-bondong Masuk Islam',d:'Karena Makkah terbuka dengan aman dan damai, ribuan orang berbondong-bondong masuk Islam. Peristiwa ini dikisahkan dalam Q.S. an-Nasr/110: 1–3. <br><b>Fathu Makkah = terbukanya kota Makkah bagi kaum muslimin, tanpa pertikaian dan peperangan.</b>',m:'Akhlak mulia menarik hati'}];
const HUD=[{ic:'1️⃣',t:'Umrah ditunda',d:'Pengikut Nabi tidak boleh umrah tahun ini, boleh tahun depan, paling lama tiga hari.'},{ic:'2️⃣',t:'Damai 10 tahun',d:'Menghentikan permusuhan dan tidak saling menyerang selama 10 tahun.'},{ic:'3️⃣',t:'Yang kembali ke Makkah',d:'Pengikut Nabi yang kembali ke Makkah dipersilakan bergabung dengan Kaum Quraisy.'},{ic:'4️⃣',t:'Menolak yang ke Madinah',d:'Orang Quraisy yang hendak menjadi pengikut Nabi ke Madinah ditolak.'},{ic:'5️⃣',t:'Suku Arab bebas memilih',d:'Suku-suku Arab bebas memilih bergabung dengan Rasulullah atau Kaum Quraisy.'}];
const PESAN=[{ic:'🤲',t:'Pesan 1',d:'Berperilaku baik antara satu dengan yang lain.'},{ic:'📿',t:'Pesan 2',d:'Mengerjakan yang diperintahkan Allah dan meninggalkan yang dilarang.'},{ic:'🧰',t:'Pesan 3',d:'Memegang amanat dengan penuh tanggung jawab.'},{ic:'🚫',t:'Pesan 4',d:'Melarang riba, yaitu mengambil tambahan yang tidak adil dari pinjaman.'},{ic:'🕊️',t:'Pesan 5',d:'Menciptakan perdamaian dan tidak ada balas dendam.'},{ic:'⚖️',t:'Pesan 6',d:'Persamaan derajat. Tidak ada yang lebih tinggi kecuali ketakwaannya.'},{ic:'🧡',t:'Pesan 7',d:'Sesungguhnya satu muslim dengan muslim lainnya adalah bersaudara.'}];
const KISAH=[['🌙 Tanda dari Jibril','Pada akhir Ramadan Rasulullah mengajak umat memperbanyak iktikaf di Masjid Nabawi. Malaikat Jibril memastikan wahyu Allah sudah tersampaikan semuanya. Rasulullah merasa waktunya telah dekat.'],['🐪 Berangkat dari Madinah','Pada bulan Zulkaidah Rasulullah mengumumkan akan berhaji dan memimpin rombongan. Menurut buku, terkumpul 30.000 laki-laki dan perempuan yang berjalan bersama beliau.'],['⛰️ Wukuf & Pidato di Arafah','Para sahabat memperhatikan dengan seksama cara beliau berhaji. Di Arafah beliau berpidato: “Hai manusia, dengarkan baik-baik, karena aku tidak tahu apakah akan bertemu kembali dengan kalian.” Di akhir pidato: “Aku tinggalkan dua petunjuk … Al-Qur’an dan Sunnah.”'],['📖 Wahyu Terakhir','Allah menurunkan Q.S. al-Mā’idah/5: 3: “… Hari ini telah Aku sempurnakan agamamu dan telah Kucukupkan nikmat-Ku bagimu serta telah Ku-ridai Islam itu menjadi agamamu.” Artinya ajaran Islam telah sempurna.'],['💧 Kembali ke Madinah','Setelah haji, Rasulullah kembali ke Madinah dan tak lama kemudian sakit. Beliau wafat pada 12 Rabiul awal tahun 11 Hijriah. Para sahabat sangat berduka.']];
const HIK=[{ic:'🤝',t:'1. Menepati janji',d:'Allah dan Rasul-Nya mengajarkan agar selalu menepati janji. Janji yang diingkari merugikan diri sendiri dan orang lain.'},{ic:'💗',t:'2. Menebar kasih sayang',d:'Rasulullah tetap menyuapi pengemis buta yang setiap hari mencacinya. Islam ramah dan penuh kasih sayang.'},{ic:'🌱',t:'3. Rendah hati',d:'Pasukan Nabi sangat banyak, tetapi beliau tidak sombong dan tidak pamer. Tetaplah rendah hati meski berilmu dan berprestasi.'},{ic:'🫂',t:'4. Persaudaraan yang kuat',d:'Rasulullah dan sahabat tetap bersaudara dengan penduduk Makkah. Kita juga harus kuat bersaudara dengan teman.'},{ic:'🌙',t:'5. Islam agama yang sempurna',d:'Q.S. al-Mā’idah ayat 3 turun di Arafah sebagai penutup. Al-Qur’an lengkap sebagai petunjuk hidup.'},{ic:'☁️',t:'6. Menambah keyakinan kepada Allah',d:'Kekuasaan Allah di atas segalanya. Apa yang Allah kehendaki cukup dengan “kun fayakūn”.'}];
const ORDER=['Perjanjian Hudaibiyah disepakati','Kaum Quraisy melanggar perjanjian','Rasulullah memberi tiga usulan penyelesaian damai','Sekitar 10.000 sahabat bersiap berangkat','Pasukan masuk Makkah dari empat penjuru','Bilal mengumandangkan azan di Kakbah','Orang-orang berbondong-bondong masuk Islam'];
const SORT=[{t:'Memaafkan Hatib bin Abi Baltha’ah yang membocorkan berita',ok:1,fb:'Rasulullah berhati lembut dan pemaaf.'},{t:'Membalas dendam kepada orang Quraisy',ok:0,fb:'Rasulullah memilih damai. Pesannya: tidak ada balas dendam.'},{t:'Masuk Makkah dengan tenang tanpa merusak apa pun',ok:1,fb:'Betul, bahkan rumah penduduk tidak dirusak.'},{t:'Memaksa penduduk Makkah masuk Islam',ok:0,fb:'Penduduk tertarik karena akhlak kaum muslimin, bukan karena paksaan.'},{t:'Tidak menyombongkan pasukan yang sangat banyak',ok:1,fb:'Itulah sikap rendah hati.'},{t:'Memamerkan kekuatan supaya orang takut',ok:0,fb:'Rasulullah tidak menunjukkan kehebatan. Rombongan tetap santun.'},{t:'Mengingatkan agar tidak ada pertikaian dan perang',ok:1,fb:'Pesan Rasulullah di Arafah mengajak hidup berdampingan.'},{t:'Merasa paling tinggi derajatnya',ok:0,fb:'Pesan Arafah: tidak ada yang lebih tinggi kecuali ketakwaannya.'}];

<h3>Uraian (dari buku, dikerjakan di buku/jurnal)</h3><ol><li>Makna Fathu Makkah: terbukanya Makkah bagi muslimin tanpa pertikaian dan peperangan.</li><li>Alasan berbondong-bondong masuk Islam: masuk dengan damai, menghormati, memaafkan; kekhawatiran perang tidak terbukti; tertarik akhlak.</li><li>Keinginan mengunjungi Makkah: kota kelahiran Nabi, ada Masjidil Haram & Kakbah (kiblat), air zam-zam, tempat haji/umrah.</li><li>Perilaku terpuji yang dipraktikkan: menepati janji, kasih sayang, rendah hati, persaudaraan, dll. disertai contoh nyata.</li><li>Hikmah Haji Wada: berperilaku baik, amanah, damai tanpa dendam, persamaan derajat, persaudaraan, berpegang Al-Qur’an & Sunnah.</li></ol>
<div class="wrap"><table><tr><th>Skor</th><th>Kriteria (tiap soal uraian)</th></tr><tr><td>4</td><td>Jawaban benar, lengkap, ada alasan/contoh, bahasa runtut</td></tr><tr><td>3</td><td>Benar tetapi kurang lengkap atau tanpa contoh</td></tr><tr><td>2</td><td>Sebagian benar atau kurang relevan</td></tr><tr><td>1</td><td>Salah/tidak sesuai</td></tr></table></div><p>Nilai uraian = jumlah skor ÷ 20 × 100.</p>
<h3>Sistem Skor & Ketuntasan</h3><ul><li>Kuis otomatis: skor = benar ÷ jumlah soal × 100. KKTP [ASUMSI] ≥ 75.</li><li>Usulan nilai akhir: kuis 50% + uraian/jurnal 30% + aktivitas (poin) 20%.</li><li><b>Remedial</b> (&lt; 75): ulangi Misi sesuai topik yang ditampilkan di hasil kuis, kerjakan kuis ulang, wawancara singkat.</li><li><b>Pengayaan</b> (≥ 75): jalur Tantangan (soal C5–C6), membuat poster/cerita “Kelas Damai”, mengajar teman.</li></ul></div>
<div class="tp"><h3>Diferensiasi 3 Jalur</h3><ul><li><b>Dibantu (scaffolding):</b> petunjuk 💡, pilihan jawaban pada cloze, guru mendampingi membaca.</li><li><b>Reguler:</b> alur standar.</li><li><b>Tantangan:</b> cloze isian bebas + 2 soal tambahan (C5–C6) + proyek poster.</li></ul>
<h3>Gamifikasi</h3><ul><li>Poin: tiap tantangan 5–25, kuis 4/soal benar. Level: Pengamat Cilik (0) → Penjelajah Sejarah (40) → Pejuang Cilik (100) → Duta Damai (170) → Teladan Sejati (240).</li><li>10 lencana; misi/tantangan; papan peringkat sesi di perangkat yang sama. Gunakan papan secara bijak agar siswa tidak membandingkan diri secara negatif; tekankan kemajuan pribadi.</li></ul>
<h3>Panduan Guru</h3><ul><li><b>Peran:</b> fasilitator, pendamping, penguat nilai. Jangan membiarkan siswa melewati bagian teks tanpa membaca.</li><li><b>Pertanyaan pemantik:</b> “Bagaimana rasanya jika janji diingkari?”, “Mengapa Rasulullah memaafkan Hatib?”, “Apa bedanya kuat dan marah?”, “Bagaimana kita menjaga persaudaraan walau berbeda pendapat?”</li><li><b>Alur:</b> JP1 layar 1–7 (pantik 5′, tantangan 25′, ringkas 5′); JP2 layar 8–12; JP3 layar 13–16. Dapat juga dipakai klasikal lewat proyektor dengan siswa bergantian menjawab.</li><li><b>Tips teknis:</b> uji tautan sebelum kelas; progres tidak tersimpan jika halaman ditutup; gunakan “Siswa Berikutnya” saat berbagi perangkat; huruf dapat diperbesar.</li><li><b>Tindak lanjut:</b> lihat topik yang ditampilkan di hasil kuis dan di papan; bentuk kelompok remedial/pengayaan; bacakan jurnal pilihan sebagai penguatan.</li></ul>
<h3>Panduan Siswa</h3><p>1) Tulis nama dan pilih jalur. 2) Baca dengan teliti, ketuk semua kartu. 3) Kerjakan tantangan; baca umpan balik. 4) Jika bingung, tekan 💡 atau tanya guru. 5) Isi jurnal dengan jujur dan lakukan komitmenmu!</p>
<h3>Penutup</h3><ul><li><b>Pengembangan lanjutan:</b> rekaman audio bacaan ayat dan doa, ilustrasi animasi, rekap otomatis ke Google Sheets, kuis kelompok.</li><li><b>Ide variasi:</b> proyek kolaboratif “Duta Damai Kelas”: kelompok membuat komik atau video 1 menit tentang penerapan pesan Haji Wada, dinilai dengan rubrik.</li><li><b>Tools gratis:</b> H5P, Canva, Google Slides/Forms, Wordwall, LearningApps, Genially (versi gratis).</li></ul></div>`}
